# Vérifie, construit et publie le site sur GitHub Pages.
# - à chaque push sur main (et vérification seule sur les autres branches)
# - chaque nuit, pour que l'accueil retire les spectacles dont la dernière date est passée
# - à la demande (onglet Actions → « Run workflow »)
name: Publication du site

on:
  push:
  pull_request:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Configuration de GitHub Pages
        id: pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - run: npm ci

      - name: Vérification et génération
        run: npm run build
        env:
          TZ: Europe/Zurich
          # « /website/ » tant que le site est servi sur theatredelagrappe-collab.github.io/website,
          # « / » une fois le domaine personnalisé configuré.
          PATH_PREFIX: ${{ steps.pages.outputs.base_path }}/

      - name: Envoi du site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publication
        id: deployment
        uses: actions/deploy-pages@v4
